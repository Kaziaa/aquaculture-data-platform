name: AquaInsight Automated Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ==========================================================
  # JOB 1: PYTHON TESTS
  # ==========================================================

  test:
    name: Python Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aquainsight_user
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: aquainsight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aquainsight_user -d aquainsight_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USER: aquainsight_user
      DB_PASSWORD: ci_test_password
      DB_NAME: aquainsight_test
      PGPASSWORD: ci_test_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Initialize PostgreSQL test schema
        run: psql -h 127.0.0.1 -U aquainsight_user -d aquainsight_test -v ON_ERROR_STOP=1 -f sql/00_init_database.sql

      - name: Run automated tests
        run: |
          python -m pytest tests/ -v


  # ==========================================================
  # JOB 2: POSTGRESQL TESTS
  # ==========================================================

  postgres-test:
    name: PostgreSQL SQL Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: aquainsight_user
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: aquainsight_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U aquainsight_user -d aquainsight_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run PostgreSQL analytical tests
        env:
          PGPASSWORD: ci_test_password
        run: |
          psql \
            -h 127.0.0.1 \
            -U aquainsight_user \
            -d aquainsight_test \
            -v ON_ERROR_STOP=1 \
            --single-transaction \
            -f sql/05_run_database_tests.sql
